name: brew pr-pull

on:
  workflow_run:
    workflows:
      - brew test-bot
    types:
      - completed

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  pr-pull:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Verify the tested formula pull request
        id: pull-request
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [[ ! "${PULL_REQUEST}" =~ ^[1-9][0-9]*$ ]]; then
            echo "The successful workflow is not linked to exactly one pull request." >&2
            exit 1
          fi

          read -r base head head_sha head_repo state draft < <(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}" \
              --jq '[.base.ref, .head.ref, .head.sha, .head.repo.full_name, .state, .draft] | @tsv'
          )
          if [[ "${base}" != "main" || "${head_repo}" != "${GITHUB_REPOSITORY}" ||
            "${state}" != "open" || "${draft}" != "false" ]]; then
            echo "The tested pull request is not an open, same-repository PR into main." >&2
            exit 1
          fi
          if [[ ! "${head}" =~ ^automation/mangapy-v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]; then
            echo "Unexpected formula update branch: ${head}" >&2
            exit 1
          fi
          if [[ "${head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "The pull request changed after Homebrew test-bot completed." >&2
            exit 1
          fi

          pr_files="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/files" \
              --jq '.[].filename'
          )"
          if [[ "${pr_files}" != "Formula/mangapy.rb" ]]; then
            echo "The tested pull request contains unexpected files:" >&2
            printf '%s\n' "${pr_files}" >&2
            exit 1
          fi

          {
            echo "branch=${head}"
            echo "head_sha=${head_sha}"
            echo "number=${PULL_REQUEST}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git-setup
        uses: Homebrew/actions/git-user-config@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git-setup.outputs.email }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git-setup.outputs.name }}
          HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
          PULL_REQUEST: ${{ steps.pull-request.outputs.number }}
        run: brew pr-pull --debug --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" "$PULL_REQUEST"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2
        with:
          branch: main

      - name: Delete branch
        env:
          BRANCH: ${{ steps.pull-request.outputs.branch }}
        run: git push --delete origin "$BRANCH"
